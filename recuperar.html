<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RutaU - Recuperar contraseña</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-simple">
<div class="tarjeta">
  <div class="icono pequeño">🔐</div>
  <h2>Recuperar contraseña</h2>
  <p class="subtitulo">Ingresa tu correo para recuperar el acceso a tu cuenta.</p>

  <form id="formRecuperar">
    <label for="correoRecuperar">Correo electrónico</label>
    <input type="email" id="correoRecuperar" placeholder="correo@ejemplo.com" required>
    <button class="btn" type="submit">Enviar enlace</button>
    <p id="mensajeRecuperar"></p>
  </form>

  <p class="registro"><a href="index.html">← Volver al inicio de sesión</a></p>
</div>
<script src="script.js"></script>
</body>
</html>
