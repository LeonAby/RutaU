<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RutaU - Iniciar sesión</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main class="contenedor">
<section class="presentacion">
  <div class="icono">🚌</div>
  <h1>RutaU</h1>
  <h2>Transporte universitario inteligente</h2>
  <p>Consulta rutas, paradas y la ubicación de tu transporte en tiempo real.</p>
</section>

<section class="login">
<div class="tarjeta">
  <h2>Iniciar sesión</h2>
  <p class="subtitulo">Accede a tu cuenta de RutaU</p>

  <form id="formLogin">
    <label for="usuario">Usuario o correo</label>
    <input type="text" id="usuario" placeholder="Ingresa tu usuario o correo" required>

    <label for="password">Contraseña</label>
    <div class="password-box">
      <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
      <button type="button" id="mostrarPassword">Mostrar</button>
    </div>

    <div class="opciones">
      <label class="recordar"><input type="checkbox"> Recordarme</label>
      <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="btn" type="submit">Iniciar sesión</button>
    <p id="mensaje"></p>
  </form>

  <p class="registro">¿No tienes una cuenta?
    <a href="registro.html">Crear cuenta</a>
  </p>
</div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
