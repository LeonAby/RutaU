<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RutaU - Crear cuenta</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-simple">
<div class="tarjeta">
  <div class="icono pequeño">🚌</div>
  <h2>Crear cuenta</h2>
  <p class="subtitulo">Regístrate para utilizar RutaU</p>

  <form id="formRegistro">
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Tu nombre completo" required>

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" placeholder="correo@ejemplo.com" required>

    <label for="nuevoUsuario">Usuario</label>
    <input type="text" id="nuevoUsuario" placeholder="Crea un usuario" required>

    <label for="nuevaPassword">Contraseña</label>
    <input type="password" id="nuevaPassword" placeholder="Crea una contraseña" required>

    <label for="confirmarPassword">Confirmar contraseña</label>
    <input type="password" id="confirmarPassword" placeholder="Repite tu contraseña" required>

    <button class="btn" type="submit">Registrarme</button>
    <p id="mensajeRegistro"></p>
  </form>

  <p class="registro"><a href="index.html">← Volver al inicio de sesión</a></p>
</div>
<script src="script.js"></script>
</body>
</html>
